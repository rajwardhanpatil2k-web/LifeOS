# Render Blueprint — API + web dashboard
# Dashboard: New + → Blueprint → this repo
# After first deploy, set MONGODB_URI (Atlas) and OPENAI_API_KEY in the service env.
# Atlas Network Access must allow 0.0.0.0/0 (Render IPs change).

services:
  - type: web
    name: lifeos-raj
    runtime: node
    plan: free
    region: singapore
    rootDir: apps/api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Kolkata
      - key: MONGODB_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
